dependencies = [
    "apiflask>=3.1.2",
    "joserfc>=1.7.5",
    "psycopg[binary]>=3.3",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-postgresql>=9.1.0",
]
