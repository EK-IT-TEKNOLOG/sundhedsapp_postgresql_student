[pytest]
# Kør fra mappen del4_tests:  uv run pytest
# Løsningerne:                uv run pytest solution/tests
testpaths = tests
# Gør det muligt at skrive "from cleaning import ..." i testene.
pythonpath = .
# Tillader test-filer med samme navn i tests/ og solution/tests/.
addopts = --import-mode=importlib
